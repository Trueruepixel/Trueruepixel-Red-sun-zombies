<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Red Sun: Zombie Assault</title>
<style>
:root{--panel:rgba(7,10,24,.93);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 32%,#252d52 0,#090d20 45%,#03040a 100%)}
.hidden{display:none!important}
.logo{font-size:clamp(32px,9vw,64px);font-weight:1000;letter-spacing:2px;text-align:center;line-height:.95;text-shadow:0 0 24px rgba(255,47,77,.5)}
.logo span{display:block;color:#ff3f56;font-size:.48em;margin-top:8px;letter-spacing:5px}
.sub{opacity:.78;text-align:center;margin:14px 0 18px;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(135px,190px));gap:10px;width:min(94vw,410px)}
.card{height:155px;border:2px solid var(--line);border-radius:15px;overflow:hidden;position:relative;background:rgba(255,255,255,.06)}
.card img{width:100%;height:116px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 5px 7px #000)}
.card .name{position:absolute;left:0;right:0;bottom:0;height:39px;display:flex;align-items:center;justify-content:center;background:rgba(2,4,12,.9);font-weight:900}
.card.selected{border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,.45);transform:scale(1.025)}
.primary{border:0;border-radius:999px;padding:14px 34px;margin-top:18px;font-size:19px;font-weight:1000;background:linear-gradient(#fff,#d9dff3);color:#10162c;box-shadow:0 7px 20px rgba(0,0,0,.35)}
.secondary{border:1px solid #fff;border-radius:999px;padding:10px 22px;margin-top:10px;background:transparent;color:white;font-weight:bold}
#hud{position:fixed;z-index:10;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 4px #000}
#bossBar{position:fixed;z-index:10;top:max(38px,calc(env(safe-area-inset-top) + 38px));left:12%;right:12%;height:15px;border:2px solid white;border-radius:20px;overflow:hidden;background:#270914;display:none}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ed193f,#a43cff)}
#bossName{text-align:center;font-size:12px;font-weight:bold;margin-top:2px;text-shadow:0 2px 3px #000}
#installTip{font-size:12px;opacity:.7;margin-top:12px;text-align:center;max-width:360px}
.resultImg{height:min(44vh,390px);max-width:80vw;object-fit:contain;filter:drop-shadow(0 10px 15px #000)}
h2{font-size:clamp(32px,9vw,58px);margin:6px 0;text-align:center}
#mute{position:fixed;z-index:15;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;border:1px solid white;background:rgba(0,0,0,.5);color:white;font-size:20px}



#playerMarker,#bossMarker{
  position:fixed;
  z-index:12;
  width:46px;
  height:46px;
  border-radius:50%;
  overflow:hidden;
  pointer-events:none;
  background:#080b18;
  box-shadow:0 0 14px rgba(255,255,255,.45),0 4px 10px rgba(0,0,0,.75);
  will-change:left,transform
}
#playerMarker{
  bottom:calc(98px + env(safe-area-inset-bottom));
  border:3px solid #67c8ff;
  transform:translateX(-50%)
}
#bossMarker{
  top:max(55px,calc(env(safe-area-inset-top) + 55px));
  border:3px solid #ff405d;
  transform:translateX(-50%);
  display:none
}
#playerMarker::after,#bossMarker::after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent
}
#playerMarker::after{
  bottom:-11px;
  border-top:11px solid #67c8ff
}
#bossMarker::after{
  top:-11px;
  border-bottom:11px solid #ff405d
}
#playerMarker img,#bossMarker img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  transform:none;
  padding:4px
}
#bossMarker img{
  object-fit:contain;
  object-position:center center;
  transform:none;
  padding:4px
}

</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div id="waveText"></div><div id="healthText"></div></div>
<div id="bossBar"><div id="bossFill"></div><div id="bossName">PREEM</div></div>
<button id="mute" class="hidden" aria-label="Mute music">♫</button>

<div id="playerMarker" class="hidden"><img id="playerMarkerImg" src="assets/argentum.png" alt="Player position"></div>
<div id="bossMarker"><img src="assets/preem.png" alt="Preem position"></div>


<section id="selectScreen" class="screen">
  <div class="logo">RED SUN<span>ZOMBIE ASSAULT</span></div>
  <div class="sub">Choose a hero. Their powers look different, but every attack has equal damage.</div>
  <div class="grid">
    <div class="card selected" data-char="argentum"><img src="assets/argentum.png"><div class="name">ARGENTUM</div></div>
    <div class="card" data-char="forgotten"><img src="assets/forgotten.png"><div class="name">FORGOTTEN</div></div>
    <div class="card" data-char="patches"><img src="assets/patches.png"><div class="name">PATCHES</div></div>
    <div class="card" data-char="ken"><img src="assets/ken.png"><div class="name">KEN</div></div>
  </div>
  <button id="play" class="primary">BEGIN BATTLE</button>
  <div id="installTip">On Android, open the browser menu and choose “Add to Home screen” to install it like an app.</div>
</section>

<section id="resultScreen" class="screen hidden">
  <img id="resultImg" class="resultImg" src="">
  <h2 id="resultTitle"></h2>
  <div id="resultText" class="sub"></div>
  <button id="again" class="primary">SELECT A NEW CHARACTER</button>
</section>

<audio id="music" src="assets/pressure-rising.wav" preload="auto" loop></audio>

<script>
(()=>{
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const select=document.getElementById('selectScreen'),result=document.getElementById('resultScreen');
const hud=document.getElementById('hud'),bossBar=document.getElementById('bossBar'),bossFill=document.getElementById('bossFill');
const waveText=document.getElementById('waveText'),healthText=document.getElementById('healthText');
const playerMarker=document.getElementById('playerMarker'),playerMarkerImg=document.getElementById('playerMarkerImg'),bossMarker=document.getElementById('bossMarker');
const music=document.getElementById('music'),mute=document.getElementById('mute');
const assetSrc={
 argentum:'assets/argentum.png',
 forgotten:'assets/forgotten.png',
 patches:'assets/patches.png',
 ken:'assets/ken.png',
 preem:'assets/preem.png'
};
const imgs={};
Object.keys(assetSrc).forEach(n=>{imgs[n]=new Image();imgs[n].src=assetSrc[n]});
const cfg={
 argentum:{shot:'#ffe76b',label:'LIGHT BEAM'},
 forgotten:{shot:'#ff511c',label:'FIREBALL'},
 patches:{shot:'#74d9ff',label:'ELECTRIC ORB'},
 ken:{shot:'#a8eeff',label:'FROST LINE'}
};
let W,H,D=1,running=false,last=0,chosen='argentum',kills=0,score=0,spawn=0,bossMode=false,cool=0;
let shake=0,flash=0;
const player={x:0,y:0,w:58,h:88,speed:470,hp:5,inv:0};
const shots=[],zombies=[],bolts=[],parts=[];
const boss={x:0,y:62,w:100,h:120,hp:50,max:50,vx:185,t:0};
const input={left:false,right:false,fire:false,jid:null,fid:null,jx0:0};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=W*D;cvs.height=H*D;ctx.setTransform(D,0,0,D,0,0);player.y=H-124;if(!player.x)player.x=W/2}
addEventListener('resize',resize);resize();
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');chosen=c.dataset.char});
document.getElementById('play').onclick=start;
document.getElementById('again').onclick=()=>{result.classList.add('hidden');select.classList.remove('hidden');hud.classList.add('hidden');mute.classList.add('hidden');bossBar.style.display='none';playerMarker.classList.add('hidden');bossMarker.style.display='none'};
mute.onclick=()=>{music.muted=!music.muted;mute.textContent=music.muted?'×':'♫'};
function reset(){
 kills=score=0;spawn=0;bossMode=false;cool=0;shots.length=zombies.length=bolts.length=parts.length=0;
 player.hp=5;player.inv=0;player.x=W/2;player.y=H-124;
 boss.hp=boss.max;boss.x=W/2-boss.w/2;boss.vx=185;boss.t=.9;
}
function start(){
 reset();running=true;select.classList.add('hidden');result.classList.add('hidden');hud.classList.remove('hidden');mute.classList.remove('hidden');
 playerMarkerImg.onload=()=>playerMarker.classList.remove('hidden');playerMarkerImg.onerror=()=>{playerMarker.classList.remove('hidden');playerMarkerImg.alt=chosen.toUpperCase()};playerMarkerImg.src=assetSrc[chosen];playerMarker.style.left=player.x+'px';playerMarker.classList.remove('hidden');bossMarker.style.display='none';
 music.currentTime=0;music.volume=.62;music.play().catch(()=>{});
 last=performance.now();requestAnimationFrame(loop);
}
function end(win){
 running=false;music.pause();hud.classList.add('hidden');bossBar.style.display='none';mute.classList.add('hidden');playerMarker.classList.add('hidden');bossMarker.style.display='none';
 document.getElementById('resultImg').src=win?assetSrc.preem:assetSrc[chosen];
 document.getElementById('resultTitle').textContent=win?'PREEM DEFEATED':'GAME OVER';
 document.getElementById('resultText').textContent=win?`${chosen.toUpperCase()} survived. Final score: ${score}. Choose another hero and fight again.`:`The zombies overwhelmed ${chosen.toUpperCase()}. Final score: ${score}.`;
 result.classList.remove('hidden');
}
function shoot(){
 if(cool>0)return;cool=.19;
 shots.push({x:player.x,y:player.y-player.h*.48,vy:-720,r:9,type:chosen});
}
function zombie(){
 const s=42+Math.random()*17;zombies.push({x:28+Math.random()*(W-56),y:-55,w:s,h:s*1.25,v:72+Math.random()*48+Math.min(kills*1.5,70),hp:2,phase:Math.random()*6.28});
}
function volley(){
 const cx=boss.x+boss.w/2,sy=boss.y+boss.h*.7;
 [-48,0,48].forEach((off,i)=>bolts.push({x:cx+off,y:sy,vx:off*.9,vy:350,r:9,phase:i}));
}
function burst(x,y,col,n=10){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=45+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.35+Math.random()*.45,col})}}
function rc(r,c){let x=Math.max(r.x-r.w/2,Math.min(c.x,r.x+r.w/2)),y=Math.max(r.y-r.h/2,Math.min(c.y,r.y+r.h/2)),dx=c.x-x,dy=c.y-y;return dx*dx+dy*dy<c.r*c.r}
function hurt(){
 if(player.inv>0)return;player.hp--;player.inv=1.15;shake=11;flash=.14;burst(player.x,player.y,'#ff314a',22);if(player.hp<=0)end(false)
}
function update(dt){
 playerMarker.style.left=player.x+'px';
 if(bossMode) bossMarker.style.left=(boss.x+boss.w/2)+'px';
 cool-=dt;player.inv-=dt;shake=Math.max(0,shake-dt*35);flash=Math.max(0,flash-dt);
 if(input.left)player.x-=player.speed*dt;if(input.right)player.x+=player.speed*dt;if(input.fire)shoot();
 player.x=Math.max(32,Math.min(W-32,player.x));
 if(!bossMode){
  spawn-=dt;if(spawn<=0){zombie();spawn=Math.max(.34,.92-kills*.018)}
  if(kills>=25){bossMode=true;zombies.length=0;bossBar.style.display='block';bossMarker.style.left=(boss.x+boss.w/2)+'px';bossMarker.style.display='block';shake=14}
 }else{
  boss.x+=boss.vx*dt;if(boss.x<8||boss.x+boss.w>W-8)boss.vx*=-1;boss.x=Math.max(8,Math.min(W-boss.w-8,boss.x));
  boss.t-=dt;if(boss.t<=0){volley();boss.t=1.05}
 }
 shots.forEach(s=>s.y+=s.vy*dt);zombies.forEach(z=>{z.y+=z.v*dt;z.x+=Math.sin(performance.now()*.002+z.phase)*10*dt});
 bolts.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});
 for(let i=shots.length-1;i>=0;i--){let s=shots[i],hit=false;
  if(bossMode&&rc({x:boss.x+boss.w/2,y:boss.y+boss.h/2,w:boss.w*.7,h:boss.h*.82},s)){boss.hp--;score+=10;hit=true;burst(s.x,s.y,cfg[chosen].shot,5);bossFill.style.width=(100*boss.hp/boss.max)+'%';if(boss.hp<=0){score+=1500;end(true);return}}
  else if(!bossMode)for(let j=zombies.length-1;j>=0;j--){let z=zombies[j];if(rc({x:z.x,y:z.y,w:z.w,h:z.h},s)){z.hp--;hit=true;burst(s.x,s.y,cfg[chosen].shot,5);if(z.hp<=0){zombies.splice(j,1);kills++;score+=100;burst(z.x,z.y,'#91e86e',14)}break}}
  if(hit||s.y<-40)shots.splice(i,1)
 }
 for(let i=zombies.length-1;i>=0;i--)if(zombies[i].y+zombies[i].h/2>H-32){zombies.splice(i,1);hurt();if(!running)return}
 for(let i=bolts.length-1;i>=0;i--){let b=bolts[i];if(rc({x:player.x,y:player.y,w:player.w*.64,h:player.h*.74},b)){bolts.splice(i,1);hurt();if(!running)return}else if(b.y>H+30)bolts.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);
 waveText.textContent=bossMode?`BOSS FIGHT • SCORE ${score}`:`ZOMBIES ${kills}/25 • SCORE ${score}`;
 healthText.textContent='♥'.repeat(player.hp)+'♡'.repeat(5-player.hp)
}
function bg(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#151a31');g.addColorStop(.55,'#090d18');g.addColorStop(1,'#1b090d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.25;for(let i=0;i<60;i++){let x=(i*91)%W,y=(i*59+performance.now()*.025)%H;ctx.fillStyle='#fff';ctx.fillRect(x,y,1.5,1.5)}ctx.globalAlpha=1;
 ctx.fillStyle='#252837';ctx.fillRect(0,H-36,W,36);ctx.strokeStyle='#5a2631';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,H-36);ctx.lineTo(W,H-36);ctx.stroke()
}
function imageContain(img,cx,cy,maxW,maxH,alpha=1){
 if(!img.complete)return;let r=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight),w=img.naturalWidth*r,h=img.naturalHeight*r;ctx.globalAlpha=alpha;ctx.drawImage(img,cx-w/2,cy-h/2,w,h);ctx.globalAlpha=1
}
function drawZombie(z){
 ctx.save();ctx.translate(z.x,z.y);ctx.fillStyle='#526d45';ctx.fillRect(-z.w*.28,-z.h*.25,z.w*.56,z.h*.58);ctx.fillStyle='#7ca066';ctx.beginPath();ctx.arc(0,-z.h*.32,z.w*.25,0,6.28);ctx.fill();ctx.fillStyle='#ff313d';ctx.fillRect(-10,-z.h*.36,6,5);ctx.fillRect(4,-z.h*.36,6,5);ctx.strokeStyle='#526d45';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-z.w*.25,-4);ctx.lineTo(-z.w*.48,14);ctx.moveTo(z.w*.25,-4);ctx.lineTo(z.w*.48,14);ctx.stroke();ctx.restore()
}
function drawShot(s){
 ctx.save();ctx.translate(s.x,s.y);ctx.shadowColor=cfg[s.type].shot;ctx.shadowBlur=14;
 if(s.type==='argentum'){ctx.strokeStyle='#fff4a1';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(0,-24);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
 if(s.type==='forgotten'){ctx.fillStyle='#ff481f';ctx.beginPath();ctx.arc(0,0,11,0,6.28);ctx.fill();ctx.fillStyle='#ffd04a';ctx.beginPath();ctx.arc(0,0,5,0,6.28);ctx.fill()}
 if(s.type==='patches'){ctx.strokeStyle='#78ddff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,12,0,6.28);ctx.stroke()}
 if(s.type==='ken'){ctx.strokeStyle='#a6eeff';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(0,-27);ctx.stroke();for(let i=0;i<4;i++){ctx.fillStyle='#fff';ctx.fillRect((i%2?1:-1)*(5+i*2),i*7-13,2,6)}}
 ctx.restore()
}
function draw(){
 ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);bg();
 zombies.forEach(drawZombie);shots.forEach(drawShot);
 bolts.forEach(b=>{ctx.save();ctx.shadowColor='#c053ff';ctx.shadowBlur=15;ctx.strokeStyle=b.phase===1?'#ff4b67':'#69c9ff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(b.x,b.y-16);ctx.lineTo(b.x-7,b.y-4);ctx.lineTo(b.x+5,b.y+8);ctx.lineTo(b.x,b.y+17);ctx.stroke();ctx.restore()});
 parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;
 controls();if(flash){ctx.fillStyle=`rgba(255,30,50,${flash*2})`;ctx.fillRect(0,0,W,H)}ctx.restore()
}
function controls(){
 let jy=H-78,jx=75,fx=W-72,fy=H-78;ctx.globalAlpha=.52;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(jx,jy,47,0,6.28);ctx.stroke();let k=input.left?-23:input.right?23:0;ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(jx+k,jy,22,0,6.28);ctx.fill();ctx.fillStyle='rgba(255,45,74,.55)';ctx.beginPath();ctx.arc(fx,fy,43,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 14px Arial';ctx.textAlign='center';ctx.fillText('FIRE',fx,fy+5);ctx.globalAlpha=1
}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
function down(x,id){if(x<W/2){input.jid=id;input.jx0=x}else{input.fid=id;input.fire=true;shoot()}}
function move(x,id){if(id===input.jid){let d=x-input.jx0;input.left=d<-10;input.right=d>10}}
function up(id){if(id===input.jid){input.jid=null;input.left=input.right=false}if(id===input.fid){input.fid=null;input.fire=false}}
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);down(e.clientX,e.pointerId)});
cvs.addEventListener('pointermove',e=>move(e.clientX,e.pointerId));cvs.addEventListener('pointerup',e=>up(e.pointerId));cvs.addEventListener('pointercancel',e=>up(e.pointerId));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.left=true;if(e.key==='ArrowRight'||e.key==='d')input.right=true;if(e.key===' '){input.fire=true;shoot()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.left=false;if(e.key==='ArrowRight'||e.key==='d')input.right=false;if(e.key===' ')input.fire=false});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
